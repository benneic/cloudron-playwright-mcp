name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: benneic/cloudron-playwright-mcp

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          MCP_VERSION=$(node -p "require('./package.json').dependencies['@playwright/mcp']")
          echo "mcp_version=${MCP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using @playwright/mcp ${MCP_VERSION}"

      - name: Sync CloudronManifest version
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('CloudronManifest.json', 'utf8'));
            m.version = '${{ steps.version.outputs.mcp_version }}';
            fs.writeFileSync('CloudronManifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          grep '"version"' CloudronManifest.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloudron
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mcp_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update CloudronVersions.json
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mcp_version }}@${{ steps.build.outputs.digest }}"
          node scripts/update-cloudron-versions.mjs "${IMAGE}"

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CloudronManifest.json CloudronVersions.json CHANGELOG
          if git diff --staged --quiet; then
            echo "No catalog changes to commit"
          else
            git commit -m "release ${{ steps.version.outputs.mcp_version }}"
            git push
          fi

      - name: Create git tag
        run: |
          git tag -f "v${{ steps.version.outputs.mcp_version }}"
          git push -f origin "v${{ steps.version.outputs.mcp_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.mcp_version }}
          name: v${{ steps.version.outputs.mcp_version }}
          generate_release_notes: true
