# Manual releases only. Automated upstream releases use upstream-watch.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      mcp_version:
        description: "@playwright/mcp version (must match package.json on this ref)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: benneic/cloudron-playwright-mcp

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          echo "mcp_version=${{ inputs.mcp_version }}" >> "$GITHUB_OUTPUT"
          echo "Using @playwright/mcp ${{ inputs.mcp_version }}"

      - name: Verify package version
        run: |
          set -eux
          V="${{ steps.version.outputs.mcp_version }}"
          PKG=$(node -p "require('./package.json').dependencies['@playwright/mcp']")
          if [ "$PKG" != "$V" ]; then
            echo "Input $V != package.json ($PKG)" >&2
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('CloudronManifest.json', 'utf8'));
            m.version = process.argv[1];
            fs.writeFileSync('CloudronManifest.json', JSON.stringify(m, null, 2) + '\n');
          " "$V"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloudron
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mcp_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update CloudronVersions.json
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mcp_version }}@${{ steps.build.outputs.digest }}"
          node scripts/update-cloudron-versions.mjs "${IMAGE}"

      - name: Commit catalog if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add CloudronManifest.json CloudronVersions.json
          if git diff --staged --quiet; then
            echo "No catalog changes to commit"
          else
            git commit -m "release ${{ steps.version.outputs.mcp_version }}"
            git push
          fi

      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -f "v${{ steps.version.outputs.mcp_version }}"
          git push -f origin "v${{ steps.version.outputs.mcp_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.mcp_version }}
          name: v${{ steps.version.outputs.mcp_version }}
          generate_release_notes: true
